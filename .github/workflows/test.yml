name: test

on:
  # Pushes made by GITHUB_TOKEN (dependabot auto-merge) do not trigger the
  # push event, so without a schedule main is never tested after a merge.
  schedule:
    - cron: '47 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run all tests
        run: make test GOTEST_FLAGS="-v -count=1"
        env:
          API_KEY: ${{ secrets.API_KEY }}
          HOST_URL: ${{ secrets.HOST_URL }}
